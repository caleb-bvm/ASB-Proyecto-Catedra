o_auditoria : bigint PK</text><text x="1083" y="761" font-size="17">tabla : nvarchar(50)</text><text x="1083" y="787" font-size="17">codigo_registro : int</text><text x="1083" y="813" font-size="17">operacion : varchar(6)</text><text x="1083" y="839" font-size="17">fecha_utc : datetime2(0)</text><text x="1083" y="865" font-size="17">usuario_sql : nvarchar(128)</text><text x="1083" y="891" font-size="17">datos_anteriores : nvarchar(max)</text><text x="1083" y="917" font-size="17">datos_nuevos : nvarchar(max)</text><path class="line" d="M475 180H550"/><rect x="481" y="147" width="53" height="25" fill="#fffdfb"/><text x="485" y="166" font-size="17">1   N</text><path class="line" d="M990 180H1065"/><rect x="994" y="147" width="53" height="25" fill="#fffdfb"/><text x="998" y="166" font-size="17">1   N</text><path class="line" d="M770 445V650"/><rect x="778" y="591" width="134" height="25" fill="#fffdfb"/><text x="782" y="610" font-size="17">1 : N respalda</text><path class="line" d="M475 805H550"/><rect x="479" y="772" width="53" height="25" fill="#fffdfb"/><text x="483" y="791" font-size="17">1   N</text><path class="line" d="M255 650V565H1285V445"/><rect x="881" y="531" width="125" height="25" fill="#fffdfb"/><text x="885" y="550" font-size="17">1 : N atiende</text><path class="line" d="M70 1015V1060H420V1015"/><rect x="76" y="1031" width="269" height="25" fill="#fffdfb"/><text x="80" y="1050" font-size="17">0..1 jefe / 0..N subordinados</text><path d="M255 445V495H1515V830H1505" fill="none" stroke="#873e29" stroke-dasharray="9 7" stroke-width="2"/><text x="1110" y="480" font-size="17">Trigger CLIENTE → AUDITORIA</text><text x="35" y="1130" font-size="18">PK = clave primaria · FK = clave foránea · UQ = único · N = 0..muchos registros dependientes</text><text x="35" y="1162" font-size="17">AUDITORIA conserva una referencia histórica sin FK para permitir el registro de eliminaciones.</text><text x="35" y="1190" font-size="17">La edad y el saldo son derivados. El deudor d