<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1210" viewBox="0 0 1540 1210"><rect width="1540" height="1210" fill="#fffdfb"/><style>text{font-family:Arial,sans-serif;fill:#2b211c}.line{fill:none;stroke:#63564b;stroke-width:2.5}</style><text x="35" y="38" font-size="28" font-weight="bold">FonaVitSV · Modelo relacional implementado</text><rect x="35" y="80" width="440" height="365" rx="12" fill="#fff" stroke="#b9a79b" stroke-width="2"/><path d="M35 135h440" stroke="#b9a79b"/><text x="55" y="116" font-size="23" font-weight="bold">CLIENTE</text><text x="53" y="165" font-size="17">codigo_cliente : int PK</text><text x="53" y="191" font-size="17">documento_identidad : varchar(10) UQ</text><text x="53" y="217" font-size="17">nombre_completo : nvarchar(120)</text><text x="53" y="243" font-size="17">fecha_nacimiento : date</text><text x="53" y="269" font-size="17">calle, casa, ciudad, departamento</text><text x="53" y="295" font-size="17">estado_familiar, beneficiario</text><rect x="550" y="80" width="440" height="365" rx="12" fill="#fff" stroke="#b9a79b" stroke-width="2"/><path d="M550 135h440" stroke="#b9a79b"/><text x="570" y="116" font-size="23" font-weight="bold">CUENTA</text><text x="568" y="165" font-size="17">numero_cuenta : varchar(20) PK</text><text x="568" y="191" font-size="17">codigo_cliente : int FK</text><text x="568" y="217" font-size="17">fecha_apertura : date</text><text x="568" y="243" font-size="17">estado : varchar(10)</text><text x="568" y="269" font-size="17">saldo_actual : decimal {derivado}</text><rect x="1065" y="80" width="440" height="365" rx="12" fill="#fff" stroke="#b9a79b" stroke-width="2"/><path d="M1065 135h440" stroke="#b9a79b"/><text x="1085" y="116" font-size="23" font-weight="bold">TRANSACCION</text><text x="1083" y="165" font-size="17">codigo_transaccion : bigint PK</text><text x="1083" y="191" font-size="17">numero_cuenta : varchar(20) FK</text><text x="1083" y="217" font-size="17">codigo_usuario : int FK</text><text x="1